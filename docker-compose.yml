services:
  # Database
  db:
    image: mysql:8.4.5
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    ports:
      - "3307:3306"
    environment:
      MYSQL_ROOT_PASSWORD: 1234
      MYSQL_PASSWORD: user_management
    networks:
      - dev


networks:
  dev:
    external: true

volumes:
  db_data: 