services:
  # Database
  db:
    image: mysql:8.4.5
    volumes:
      - db_data:/var/lib/mysql
    restart: always
    ports:
      - "${DATABASE_POST_PUBLIC}:3306"
    environment:
      MYSQL_ROOT_PASSWORD: ${DATABASE_PASSWORD}
    networks:
      - dev

  backend_user_management:
    build: .
    ports:
      - "3001:3001"
    env_file:
      - .env.example
    networks:
      - dev


networks:
  dev:
    external: true

volumes:
  db_data: 